# Existing killed.wtf origin: Cloudflare Flexible -> HTTP :80.
# Install alongside killed.wtf.conf; keep the existing website/upstream untouched.
# Requires the Cloudflare range snippets maintained by killed-update-cf-ips.
# HTTPS redirects belong at Cloudflare, never in this origin server block.
geo $realip_remote_addr $concept_peer_ok {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    include /etc/nginx/snippets/cloudflare-geo.conf;
}
upstream concept_badges {
    server 127.0.0.1:8087;
    keepalive 8;
}
server {
    listen 80;
    listen [::]:80;
    server_name push.killed.wtf;
    server_tokens off;
    include /etc/nginx/snippets/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;
    if ($concept_peer_ok = 0) { return 444; }
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    access_log off;
    error_log /var/log/nginx/concept.error.log warn;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    location ^~ /v3/badges {
        limit_except GET POST OPTIONS { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://concept_badges;
    }
    location = /healthz { proxy_pass http://concept_badges; }
    location / { return 404; }
}
