# Place in nginx's http{} include directory, e.g. /etc/nginx/conf.d/.
upstream concept_badges { server 127.0.0.1:8087; keepalive 8; }
server {
    listen 80;
    server_name push.killed.wtf;
    return 301 https://push.killed.wtf$request_uri;
}
server {
    listen 443 ssl;
    server_name push.killed.wtf;
    ssl_certificate /etc/concept-badges/origin.pem;
    ssl_certificate_key /etc/concept-badges/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location ^~ /v3/badges {
        limit_except GET POST OPTIONS { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://concept_badges;
    }
    location = /healthz { proxy_pass http://concept_badges; }
    location / { return 404; }
}
