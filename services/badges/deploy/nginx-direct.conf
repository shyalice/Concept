# Direct DNS (Cloudflare proxy disabled): obtain a publicly trusted certificate
# for push.killed.wtf using certbot/acme.sh, then install this in nginx http{}.
upstream concept_badges { server 127.0.0.1:8087; keepalive 8; }
server {
    listen 80;
    server_name push.killed.wtf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://push.killed.wtf$request_uri; }
}
server {
    listen 443 ssl;
    server_name push.killed.wtf;
    ssl_certificate /etc/letsencrypt/live/push.killed.wtf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.killed.wtf/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location ^~ /v3/badges {
        limit_except GET POST OPTIONS { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://concept_badges;
    }
    location = /healthz { proxy_pass http://concept_badges; }
    location / { return 404; }
}
